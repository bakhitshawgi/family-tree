const SUG_FIELDS = ['name_ar', 'name_en', 'birth_y', 'living', 'death_y', 'place_ar', 'edu_ar', 'job_ar', 'notes_ar'];
function sugCurrent(p, f){ if(f === 'birth_y') return p.birth ? String(p.birth.y) : ''; if(f === 'death_y') return p.death ? String(p.death.y) : ''; if(f === 'living') return p.living ? '1' : '0'; return p[f] || ''; }
function sugDisplay(f, v){ if(f === 'living') return v === '1' ? L('على قيد الحياة', 'Living') : L('متوفى', 'Deceased'); return v === '' ? '—' : v; }
ACT.suggest = pid => {
  const p = P(pid), F = FIELD_LABEL();
  let h = `<div class="ov-pad"><h2 class="form-title">${esc(L('اقتراح تصحيح: ', 'Suggest a correction: ') + name(pid))}</h2><p class="hint">${esc(L('عدّل ما تراه خطأ فقط. يصل اقتراحك للمشرف المسؤول عن هذا الفرع ليوافق عليه أو يرفضه.', 'Change only what is wrong. The admin responsible for this branch will approve or reject it.'))}</p><div class="form-error" id="f_err"></div>`;
  SUG_FIELDS.forEach(f => {
    if(f === 'living') h += `<div class="field"><label>${esc(F.living)}</label><select id="sg_living"><option value="1" ${p.living ? 'selected' : ''}>${esc(L('على قيد الحياة', 'Living'))}</option><option value="0" ${!p.living ? 'selected' : ''}>${esc(L('متوفى', 'Deceased'))}</option></select></div>`;
    else if(f === 'notes_ar') h += `<div class="field"><label>${esc(F.notes_ar)}</label><textarea id="sg_notes_ar" rows="2">${esc(p.notes_ar)}</textarea></div>`;
    else h += `<div class="field"><label>${esc(F[f])}</label><input id="sg_${f}" ${/_y$/.test(f) ? 'inputmode="numeric" maxlength="4"' : ''} ${f === 'name_en' ? 'dir="ltr"' : ''} value="${esc(sugCurrent(p, f))}"></div>`;
  });
  h += `<div class="field"><label>${esc(L('مصدر المعلومة أو ملاحظة للمشرف', 'Source or note for the admin'))}</label><textarea id="sg_comment" rows="2"></textarea></div><button class="full-btn" data-act="sendSuggestion" data-arg="${esc(pid)}">${esc(L('إرسال الاقتراح', 'Send suggestion'))}</button></div>`;
  openOv(h);
};
ACT.sendSuggestion = pid => {
  try{
    const p = P(pid), changes = {};
    SUG_FIELDS.forEach(f => { const nv = val('sg_' + f), ov = sugCurrent(p, f); if(nv !== ov) changes[f] = { from:ov, to:nv }; });
    ['birth_y', 'death_y'].forEach(f => { if(changes[f] && changes[f].to && !/^\d{3,4}$/.test(changes[f].to)) throw L('السنة يجب أن تكون أرقامًا', 'Year must be numeric'); });
    if(changes.name_ar && !changes.name_ar.to) throw L('لا يمكن أن يكون الاسم فارغًا', 'Name cannot be empty');
    const comment = val('sg_comment');
    if(!Object.keys(changes).length && !comment) throw L('لم تغيّر أي حقل', 'You did not change anything');
    DB.suggestions.unshift({ id:uid('s_'), pid, by:currentUser.username, ts:Date.now(), changes, comment, status:'pending' });
    const approvers = DB.users.filter(u => u.active && u.username !== currentUser.username && canEdit(pid, u) === 'full');
    approvers.forEach(u => notify(u.username, `طلب تصحيح جديد على ${p.name_ar} من ${currentUser.name_ar}`, `New correction request for ${p.name_en || p.name_ar} from ${currentUser.name_en || currentUser.name_ar}`));
    save(); closeOv(); renderAll(); toast(L(`أُرسل اقتراحك إلى ${approvers.length} مشرف ✓`, `Sent to ${approvers.length} admin(s) ✓`));
  }catch(e){ formError(typeof e === 'string' ? e : e.message); }
};
function applySuggestion(s){
  const p = P(s.pid); if(!p) return;
  for(const [f, { to }] of Object.entries(s.changes)){
    if(f === 'birth_y') p.birth = to ? { y:Number(to), m:null, d:null, cal:(p.birth && p.birth.cal) || 'g', approx:false } : null;
    else if(f === 'death_y') p.death = to ? { y:Number(to), m:null, d:null, cal:(p.death && p.death.cal) || 'g', approx:false } : null;
    else if(f === 'living'){ p.living = to === '1'; if(p.living) p.death = null; }
    else p[f] = to;
  }
}
async function decide(sid, ok){
  const s = DB.suggestions.find(x => x.id === sid); if(!s || s.status !== 'pending' || canEdit(s.pid) !== 'full' || s.by === currentUser.username) return toast(DENIED());
  s.status = ok ? 'approved' : 'rejected'; renderAll();
  const { error } = await sb.rpc('decide_suggestion', { p_id:sid, p_approve:ok });
  if(error) toast(serverMsg(error), 6000); else toast(ok ? L('تم التطبيق ✓', 'Applied ✓') : L('تم الرفض', 'Rejected'));
  gen++; if(await reload(true)) afterLoad();
}

}

function toGedcom(){
  const I = {}, F = {}; let i = 1, j = 1;
  Object.keys(DB.persons).forEach(k => I[k] = `@I${i++}@`); Object.keys(DB.unions).forEach(k => F[k] = `@F${j++}@`);
  const M = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const gd = d => { if(!d || !d.y) return null; if(d.cal === 'h') return `(${[d.d, d.m, d.y].filter(Boolean).join('/')} AH)`; return (d.approx ? 'ABT ' : '') + (d.d && d.m ? d.d + ' ' : '') + (d.m ? M[d.m - 1] + ' ' : '') + d.y; };
  const one = s => String(s || '').replace(/[\r\n]+/g, ' ').trim();
  const L0 = ['0 HEAD', '1 SOUR FAMILY_TREE_PROTOTYPE', '2 VERS 2.0', '1 GEDC', '2 VERS 5.5.1', '2 FORM LINEAGE-LINKED', '1 CHAR UTF-8'];
  for(const p of Object.values(DB.persons)){
    L0.push(`0 ${I[p.id]} INDI`, `1 NAME ${one(p.name_ar)}`); if(p.name_en) L0.push(`1 NAME ${one(p.name_en)}`, '2 TYPE aka');
    L0.push(`1 SEX ${p.gender === 'f' ? 'F' : 'M'}`);
    if(p.birth || p.place_ar || p.place_en){ L0.push('1 BIRT'); const b = gd(p.birth); if(b) L0.push(`2 DATE ${b}`); if(p.place_en || p.place_ar) L0.push(`2 PLAC ${one(p.place_en || p.place_ar)}`); }
    if(!p.living){ const d = gd(p.death); L0.push(d ? '1 DEAT' : '1 DEAT Y'); if(d) L0.push(`2 DATE ${d}`); }
    if(p.job_en || p.job_ar) L0.push(`1 OCCU ${one(p.job_en || p.job_ar)}`);
    if(p.edu_en || p.edu_ar) L0.push(`1 EDUC ${one(p.edu_en || p.edu_ar)}`);
    if(p.notes_ar || p.notes_en) L0.push(`1 NOTE ${one(p.notes_ar || p.notes_en)}`);
    if(p.parentUnion && F[p.parentUnion]) L0.push(`1 FAMC ${F[p.parentUnion]}`);
    unionsOf(p.id).forEach(u => L0.push(`1 FAMS ${F[u.id]}`));
  }
  for(const u of Object.values(DB.unions)){
    L0.push(`0 ${F[u.id]} FAM`);
    const hs = u.partners.find(x => !isF(x)), wf = u.partners.find(x => isF(x) && x !== hs);
    if(hs) L0.push(`1 HUSB ${I[hs]}`); if(wf) L0.push(`1 WIFE ${I[wf]}`);
    childrenOfUnion(u.id).forEach(c => L0.push(`1 CHIL ${I[c.id]}`));
    if(u.start){ L0.push('1 MARR'); L0.push(`2 DATE ${gd(u.start)}`); }
    if(u.status === 'divorced'){ L0.push('1 DIV'); if(u.end) L0.push(`2 DATE ${gd(u.end)}`); }
  }
  L0.push('0 TRLR');
  return L0.join('\n');
}

}

/* ---------- import a family (super admin) ----------
   Format: { people:[{ key, name_ar, name_en, gender:'m'|'f', living, status_unknown, birth_y, death_y, phone }],
             unions:[{ partners:[key, key?], children:[key…] }] }
   People already in the tree (same English or Arabic name) are reused, never duplicated. */
let importPlan = null;
ACT.importForm = () => {
  if(!mustSuper()) return;
  importPlan = null;
  openOv(`<div class="ov-pad"><h2 class="form-title">${esc(L('استيراد عائلة', 'Import a family'))}</h2><div class="form-error" id="f_err"></div>
    <p class="hint">${esc(L('الصق ملف الاستيراد (JSON). الأشخاص الموجودون في الشجرة بنفس الاسم يُربطون ولا يُكرَّرون. ستظهر لك معاينة قبل الحفظ.', 'Paste the import file (JSON). People already in the tree with the same name are linked, not duplicated. You will see a preview before anything is saved.'))}</p>
    <div class="field"><textarea class="mono" id="imp_text" spellcheck="false"></textarea></div>
    <button class="full-btn" data-act="importPreview">${esc(L('معاينة', 'Preview'))}</button><div id="imp_preview"></div></div>`);
};
function buildImportPlan(text){
  let d; try{ d = JSON.parse(text); }catch(e){ throw L('الملف ليس JSON صحيحًا', 'Not valid JSON'); }
  if(d && Array.isArray(d.people) && !d.unions) d.unions = [];
  if(!d || !Array.isArray(d.people) || !Array.isArray(d.unions)) throw L('الملف يجب أن يحتوي people و unions', 'File must contain people and unions');
  const byKey = {};
  d.people.forEach(x => {
    if(!x || !x.key || byKey[x.key]) throw L('مفتاح شخص مفقود أو مكرر: ', 'Missing or duplicate person key: ') + (x && x.key);
    if(!String(x.name_ar || '').trim()) throw L('الاسم العربي مطلوب: ', 'Arabic name required: ') + x.key;
    if(x.gender !== 'm' && x.gender !== 'f') throw L('الجنس غير صحيح: ', 'Invalid gender: ') + x.key;
    byKey[x.key] = x;
  });
  const ps = Object.values(DB.persons), ids = {}, used = new Set(), problems = [];
  const take = (x, id) => { if(used.has(id)) throw L('شخصان في الملف يطابقان نفس الفرد: ', 'Two entries match the same person: ') + name(id); used.add(id); ids[x.key] = id; };
  /* 1) exact full-name match (Arabic or English) */
  for(const x of d.people){
    const hits = ps.filter(p => (x.name_en && norm(p.name_en) === norm(x.name_en)) || norm(p.name_ar) === norm(x.name_ar));
    if(hits.length > 1) throw L('أكثر من شخص في الشجرة بنفس الاسم: ', 'Several people in the tree share this name: ') + x.name_ar;
    if(hits.length) take(x, hits[0].id);
  }
  /* 2) structural match: same first name + gender among the existing children / spouses of an already-matched relative */
  const first = s => norm(s).split(/\s+/)[0] || '';
  const sameFirst = (p, x) => p.gender === x.gender && ((x.name_en && p.name_en && first(p.name_en) === first(x.name_en)) || first(p.name_ar) === first(x.name_ar));
  const pick = (cands, x) => { const c = [...new Set(cands)].filter(id => P(id) && !used.has(id) && sameFirst(P(id), x)); return c.length === 1 ? c[0] : null; };
  for(let changed = true; changed;){
    changed = false;
    for(const u of d.unions){
      /* a parent can be found through an already-matched child */
      const kidParents = (u.children || []).filter(k => ids[k]).flatMap(k => parentsOf(ids[k]));
      if(kidParents.length) for(const k of u.partners || []){ const x = byKey[k]; if(!x || ids[k]) continue; const m = pick(kidParents, x); if(m){ take(x, m); changed = true; } }
      const known = (u.partners || []).filter(k => ids[k]).map(k => ids[k]);
      if(!known.length) continue;
      /* children of either named parent (some may be recorded under one parent only); first name + gender must still match uniquely */
      const kidPool = [...new Set(known.flatMap(childrenOf))];
      for(const k of u.children || []){ const x = byKey[k]; if(!x || ids[k]) continue; const m = pick(kidPool, x); if(m){ take(x, m); changed = true; } }
      for(const k of u.partners || []){ const x = byKey[k]; if(!x || ids[k]) continue; const m = pick(known.flatMap(spousesOf), x); if(m){ take(x, m); changed = true; } }
    }
  }
  const matched = [], fresh = [];
  for(const x of d.people){ if(ids[x.key]) matched.push([x, ids[x.key]]); else { ids[x.key] = uid('p_'); fresh.push(x); } }
  const childSeen = new Set(), unions = [], moves = [];
  for(const u of d.unions){
    const parts = (u.partners || []).map(k => { if(!byKey[k]) throw L('شريك غير معروف: ', 'Unknown partner: ') + k; return ids[k]; });
    if(parts.length < 1 || parts.length > 2 || new Set(parts).size !== parts.length) throw L('زواج غير صالح', 'Invalid marriage');
    let same = Object.values(DB.unions).find(e => e.partners.length === parts.length && parts.every(p => e.partners.includes(p)));
    /* only one parent given: join the existing marriage of that parent which already holds one of these children,
       so the new children become full siblings instead of half-siblings */
    if(!same && parts.length === 1){ const via = (u.children || []).map(k => ids[k] && P(ids[k]) && P(ids[k]).parentUnion).find(pu => pu && DB.unions[pu] && DB.unions[pu].partners.includes(parts[0])); if(via) same = DB.unions[via]; }
    const uidv = same ? same.id : uid('u_'), kids = [];
    (u.children || []).forEach((k, i) => {
      if(!byKey[k]) throw L('ابن غير معروف: ', 'Unknown child: ') + k;
      if(childSeen.has(k)) throw L('شخص له أكثر من والدين في الملف: ', 'Person listed under two sets of parents: ') + byKey[k].name_ar;
      childSeen.add(k);
      const cid = ids[k], ex = P(cid);
      if(parts.includes(cid) || parts.some(p => P(p) && P(cid) && isDescendant(p, cid))) throw L('دورة في النسب عند: ', 'Ancestry loop at: ') + byKey[k].name_ar;
      if(ex && ex.parentUnion && ex.parentUnion !== uidv){
        const cur = DB.unions[ex.parentUnion];
        /* recorded under one parent alone (or a duplicate of the same couple) and the file names both parents: move into the couple's marriage */
        if(cur && cur.partners.length <= parts.length && cur.partners.every(x => parts.includes(x))){ moves.push([cid, cur.id, true]); kids.push([cid, i]); return; }
        /* the file explicitly says these are the real parents ("reassign": true): move the child from the parents recorded now */
        if(u.reassign === true){ moves.push([cid, ex.parentUnion, false]); kids.push([cid, i]); return; }
        problems.push(L(`«${name(cid)}» مسجل بوالدين آخرين في الشجرة — تُرك كما هو`, `“${name(cid)}” already has other parents in the tree — left unchanged`)); return;
      }
      if(ex && ex.parentUnion === uidv) return;
      kids.push([cid, i]);
    });
    const st = u.status == null ? null : String(u.status);
    if(st !== null && !['married', 'divorced', 'widowed'].includes(st)) throw L('حالة زواج غير صحيحة: ', 'Invalid marriage status: ') + st;
    const setStatus = st && (!same || same.status !== st) ? st : null;
    unions.push({ id:uidv, isNew:!same, partners:parts, kids, setStatus });
  }
  const fillEn = matched.filter(([x, id]) => String(x.name_en || '').trim() && !String(P(id).name_en || '').trim()).map(([x, id]) => [id, String(x.name_en).trim()]);
  return { byKey, ids, matched, fresh, unions, problems, moves, fillEn };
}
ACT.importPreview = () => {
  try{
    importPlan = buildImportPlan(val('imp_text'));
    const pl = importPlan, nu = pl.unions.filter(u => u.isNew).length, links = pl.unions.reduce((a, u) => a + u.kids.length, 0);
    $('imp_preview').innerHTML = `<div class="info-card"><h3>${esc(L('المعاينة', 'Preview'))}</h3>
      <p class="small">${esc(L(`${pl.fresh.length} شخصًا جديدًا · ${pl.matched.length} موجودون مسبقًا · ${nu} زواجًا جديدًا · ${links} رابط أبوة`, `${pl.fresh.length} new people · ${pl.matched.length} already in the tree · ${nu} new marriages · ${links} parent links`))}</p>
      ${pl.matched.length ? `<p class="section-title">${esc(L('سيُربطون بالموجودين (لن يُكرَّروا)', 'Linked to existing (not duplicated)'))}</p><p class="small">${pl.matched.map(([x, id]) => esc(x.name_ar) + ' ← ' + esc(name(id))).join('<br>')}</p>` : ''}
      ${pl.unions.some(u => u.setStatus) ? `<p class="section-title">💍 ${esc(L('حالة الزواج', 'Marriage status'))}</p><p class="small">${pl.unions.filter(u => u.setStatus).map(u => esc(u.partners.map(id => P(id) ? name(id) : (Object.values(pl.byKey).find(x => pl.ids[x.key] === id) || {}).name_ar).join(' + ')) + ' — ' + esc(unionStatus({ status:u.setStatus }))).join('<br>')}</p>` : ''}
      ${pl.fillEn.length ? `<p class="section-title">🔤 ${esc(L('سيُضاف الاسم الإنجليزي (كان فارغًا)', 'English name added (was empty)'))}</p><p class="small" dir="ltr" style="text-align:start">${pl.fillEn.map(([id, en]) => esc(en)).join(' · ')}</p>` : ''}
      ${pl.moves.length ? `<p class="section-title">🔗 ${esc(L('سيُنقلون إلى زواج والديهم الكامل', 'Moved into their parents’ full marriage'))}</p><p class="small">${pl.moves.map(([cid, from, sub]) => esc(name(cid)) + (sub ? '' : ` <span class="muted">(${esc(L('من ', 'from ') + unionName(DB.unions[from]))})</span>`)).join('، ')}</p>` : ''}
      ${pl.problems.length ? `<p class="section-title">⚠️ ${esc(L('تنبيهات', 'Warnings'))}</p><p class="small">${pl.problems.map(esc).join('<br>')}</p>` : ''}
      <p class="section-title">${esc(L('الجدد', 'New people'))}</p><p class="small">${pl.fresh.map(x => esc(x.name_ar) + (x.name_en ? ` <span class="muted">(${esc(x.name_en)})</span>` : '')).join('، ')}</p>
      <button class="full-btn" data-act="importApply">${esc(L('استيراد وحفظ', 'Import & save'))}</button></div>`;
  }catch(e){ importPlan = null; $('imp_preview').innerHTML = ''; formError(typeof e === 'string' ? e : e.message); }
};
ACT.importApply = () => {
  const pl = importPlan; if(!pl || !mustSuper()) return;
  confirmBox(pl.fresh.length ? L(`إضافة ${pl.fresh.length} شخصًا إلى الشجرة؟`, `Add ${pl.fresh.length} people to the tree?`) : L('حفظ التحديثات؟', 'Save the updates?'), () => {
    beginChange();
    pl.fillEn.forEach(([id, en]) => { if(P(id) && !String(P(id).name_en || '').trim()) P(id).name_en = en; });
    const yd = y => (Number.isInteger(y) ? { y, m:null, d:null, cal:'g', approx:false } : null);
    pl.fresh.forEach(x => {
      const living = x.living !== false;
      DB.persons[pl.ids[x.key]] = mkP(pl.ids[x.key], { name_ar:String(x.name_ar).trim(), name_en:String(x.name_en || '').trim(), gender:x.gender, living,
        statusUnknown:!!x.status_unknown && living, birth:yd(x.birth_y), death:living ? null : yd(x.death_y), phone:RX.phone.test(x.phone || '') ? x.phone : '', consent:false });
    });
    pl.unions.forEach(u => {
      if(u.isNew) DB.unions[u.id] = { id:u.id, partners:u.partners.slice(), status:u.setStatus || 'married', start:null, end:null };
      else if(u.setStatus && DB.unions[u.id]){ DB.unions[u.id].status = u.setStatus; if(u.setStatus === 'married') DB.unions[u.id].end = null; }
      u.kids.forEach(([cid, i]) => { const p = P(cid); p.parentUnion = u.id; p.order = i; });
    });
    const emptied = [...new Set(pl.moves.filter(m => m[2]).map(m => m[1]))];
    importPlan = null; closeOv(); commit(); toast(L('تم الاستيراد ✓', 'Imported ✓'), 3500);
    if(emptied.length) setTimeout(() => { chain = chain.then(async () => { const gone = emptied.filter(id => DB.unions[id] && !childrenOfUnion(id).length); if(gone.length){ beginChange(); gone.forEach(id => delete DB.unions[id]); commit(); } }); }, 0);
  }, L('استيراد', 'Import'));
};
